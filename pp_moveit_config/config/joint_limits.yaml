# Acceleration limits for time parametrization (the URDF only has position, velocity and
# effort limits) and default scaling of the motions planned by MoveIt.
default_velocity_scaling_factor: 0.4
default_acceleration_scaling_factor: 0.4

joint_limits:
  shoulder_pan_joint: {has_acceleration_limits: true, max_acceleration: 3.0}
  shoulder_lift_joint: {has_acceleration_limits: true, max_acceleration: 3.0}
  elbow_joint: {has_acceleration_limits: true, max_acceleration: 3.0}
  wrist_1_joint: {has_acceleration_limits: true, max_acceleration: 3.0}
  wrist_2_joint: {has_acceleration_limits: true, max_acceleration: 3.0}
  wrist_3_joint: {has_acceleration_limits: true, max_acceleration: 3.0}
  left_finger_joint: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 1.0}
  right_finger_joint: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 1.0}
